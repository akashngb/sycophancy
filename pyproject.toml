[project]
name = "syco"
version = "0.1.0"
description = "LLM sycophancy mitigation research harness (TMI, University of Toronto)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "TMI Sycophancy Team" }]

dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
    "datasets>=2.20",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.32",
]

[project.optional-dependencies]
interp = [
    "transformer-lens>=2.0",
    "nnsight>=0.3",
    "scikit-learn>=1.4",
]
api = [
    "openai>=1.40",
    "anthropic>=0.34",
]
serve = [
    # vllm only works on Linux + CUDA. See docs/setup-guide.md.
    "vllm>=0.5",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]

[project.scripts]
syco = "syco.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syco"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks", "results", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # typer uses function calls in defaults
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Resolve a lockfile so teammates get identical environments.
# Developers install dev tools with: uv sync --extra dev
